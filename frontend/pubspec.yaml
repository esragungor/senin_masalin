name: senin_masalin
description: "Çocuğunuz için kişiselleştirilmiş masallar"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.4

  # Auth
  google_sign_in: ^6.2.1

  # Audio (TTS oynatma)
  just_audio: ^0.9.40

  # Navigation
  go_router: ^14.3.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utilities (image_gallery_saver puzzle sayfasında eklenecek)
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  path_provider: ^2.1.5
  gal: ^2.3.2
  http: ^1.6.0
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

